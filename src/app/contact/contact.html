<div class="content-container animate-fade-in">
  <h1 class="display-3 mb-5 section-title white">Contact Us</h1>

  <div class="row">
    <div class="col-md-6 mb-5">
      <div class="glass-panel p-5 h-100 border-white">
        <h3 class="mb-4 white">Get in Touch</h3>
        <p class="mb-4 lead text-white">Have questions about our mission or products? We'd love to hear from you.</p>

        <div class="contact-info mt-5">
          <div class="d-flex align-items-center mb-4">
            <i class="bi bi-geo-alt white fs-3 me-3"></i>
            <div>
              <h5 class="mb-0 white">Address</h5>
              <p class="mb-0 text-white">Chennai</p>
            </div>
          </div>

          <div class="d-flex align-items-center mb-4">
            <i class="bi bi-envelope white fs-3 me-3"></i>
            <div>
              <h5 class="mb-0 white">Email</h5>
              <p class="mb-0 text-white">support&#64;gahranoxcarvel.in</p>
            </div>
          </div>

          <div class="d-flex align-items-center mb-4">
            <i class="bi bi-telephone white fs-3 me-3"></i>
            <div>
              <h5 class="mb-0 white">Phone</h5>
              <p class="mb-0 text-white">9962854042</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-5">
      <div class="glass-panel p-5 border-white">
        <form>
          <div class="mb-3">
            <label class="form-label white">Full Name</label>
            <input type="text" class="form-control custom-input" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label white">Email Address</label>
            <input type="email" class="form-control custom-input" placeholder="name@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label white">Message</label>
            <textarea class="form-control custom-input" rows="5" placeholder="Your message..."></textarea>
          </div>
          <button type="submit" class="btn btn-explore w-100 mt-4">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
