<header class="header fixed-top d-flex align-items-center justify-content-between px-4">
  <div class="header-left d-flex align-items-center">
    <a routerLink="/" class="d-flex align-items-center text-decoration-none">
      <img src="new images/website logo.png" alt="Logo" class="logo me-3">

      <div class="vertical-text times-new-roman d-flex gap-3">
        <div class="word-col d-flex flex-column align-items-center">
          <span>G</span><span>A</span><span>H</span><span>R</span><span>A</span><span>N</span><span>O</span><span>X</span>
        </div>
        <div class="word-col d-flex flex-column align-items-center">
          <span>C</span><span>A</span><span>R</span><span>V</span><span>E</span><span>L</span>
        </div>
      </div>
    </a>
  </div>

  <div class="header-right">
    <button class="btn burger-btn" (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>
