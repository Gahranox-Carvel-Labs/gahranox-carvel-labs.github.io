<div class="products-page py-5">
  <div class="container">
    <!-- Page Header -->
    <div class="text-center mb-5" data-aos="fade-down">
      <h2 class="display-4 orange-text fw-bold">Our Products</h2>
      <p class="lead text-light opacity-75">Innovative solutions for a smarter future</p>
    </div>

    <div class="row">
      <!-- Sidebar Filters -->
      <aside class="col-lg-3 mb-4" data-aos="fade-right">
        <div class="filter-sidebar glass-card p-4 orange-border">
          <h3 class="h5 orange-text mb-4">
            <i class="bi bi-funnel me-2"></i>Filters
          </h3>

          <div class="filter-section">
            <p class="small text-light mb-3 opacity-75">Product Type</p>
            <div class="d-flex flex-wrap gap-2">
              <button
                (click)="setCategory('All')"
                [class.active]="selectedCategory === 'All'"
                class="filter-pill">
                All
              </button>
              <button
                (click)="setCategory('SaaS')"
                [class.active]="selectedCategory === 'SaaS'"
                class="filter-pill">
                SaaS
              </button>
              <button
                (click)="setCategory('Hardware')"
                [class.active]="selectedCategory === 'Hardware'"
                class="filter-pill">
                Hardware
              </button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Products Grid -->
      <div class="col-lg-9">
        <div class="row g-4">
          <div class="col-md-6" *ngFor="let product of filteredProducts(); let i = index"
               [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="i * 100">
            <div class="product-card glass-card h-100 overflow-hidden">
              <!-- Image Section -->
              <div class="product-image-container p-3">
                <div class="image-wrapper glass-card-dark position-relative">
                  <img [src]="product.images[product.currentImageIndex]"
                       [alt]="product.name"
                       class="img-fluid product-main-image">

                  <!-- Carousel Controls for Hardware -->
                  <ng-container *ngIf="product.category === 'Hardware' && product.images.length > 1">
                    <button class="carousel-nav prev" (click)="prevImage(product, $event)">
                      <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="carousel-nav next" (click)="nextImage(product, $event)">
                      <i class="bi bi-chevron-right"></i>
                    </button>
                  </ng-container>
                </div>
              </div>

              <!-- Info Section -->
              <div class="product-body p-4 text-center">
                <h4 class="product-title orange-text mb-2">{{ product.name }}</h4>
                <p class="product-description text-light opacity-75 small mb-4">
                  {{ product.description }}
                </p>

                <div class="product-footer mt-auto d-flex gap-2 flex-wrap">
                  <!-- Primary Button -->
                  <a *ngIf="product.isExternal"
                     [href]="product.link"
                     target="_blank"
                     class="btn-product-action flex-grow-1">
                    {{ product.buttonText }} <i class="bi bi-box-arrow-up-right ms-2"></i>
                  </a>
                  <a *ngIf="!product.isExternal"
                     [routerLink]="product.link"
                     class="btn-product-action flex-grow-1">
                    {{ product.buttonText }} <i class="bi bi-cart3 ms-2"></i>
                  </a>

                  <!-- Secondary Button -->
                  <a *ngIf="product.secondaryButtonText"
                     [routerLink]="product.secondaryButtonLink"
                     class="btn-product-action secondary flex-grow-1">
                    {{ product.secondaryButtonText }} <i class="bi bi-box-seam ms-2"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
